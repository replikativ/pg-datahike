version: 2.1

orbs:
  tools: replikativ/clj-tools@0

# ---------------------------------------------------------------------------
# Executors
# ---------------------------------------------------------------------------
#
# The orb's `tools/clojurecli` image stopped shipping with Java at some
# point — `clojure -T:build compile-java` bombs with "Couldn't find 'java'.
# Please set JAVA_HOME." To keep CI predictable across orb refreshes we pin
# our own `cimg/openjdk:21.0`-based executor and install Clojure CLI + bb
# on top via the `install-clj-tools` command. JDK 21 matches both the
# pgjdbc toolchain and the Hibernate pom target.

executors:
  clj-jdk21:
    docker:
      - image: cimg/openjdk:21.0
    resource_class: medium

  # Proximum's released generation implementation targets the JDK 22+
  # incubating Vector API. Keep this separate from the JDK 17-compatible
  # pg-datahike runtime and use it only for the optional secondary vertical.
  clj-jdk25:
    docker:
      - image: cimg/openjdk:25.0
    resource_class: medium

commands:
  install-clj-tools:
    description: "Install Clojure CLI + babashka on a bare JDK image."
    steps:
      - run:
          name: Install Clojure CLI
          command: |
            curl -sSLO --fail https://github.com/clojure/brew-install/releases/latest/download/linux-install.sh
            chmod +x linux-install.sh
            sudo ./linux-install.sh
      - run:
          name: Install babashka
          command: curl -sL https://raw.githubusercontent.com/babashka/babashka/master/install | sudo bash

  start-pgwire-and-wait:
    description: |
      Start pg-datahike's pgwire server in the background and block
      until port 15432 is reachable. On timeout, prints the tail of the
      server's stdout/stderr so CI logs show why the server didn't boot
      (missing dep, classpath error, port collision, …) — otherwise a
      failed poll reads as "something broke, check elsewhere".
    steps:
      - run:
          name: Start pgwire server (background)
          command: clojure -M:server 2>&1 | tee /tmp/pgwire.log
          background: true
      - run:
          name: Wait for pgwire on :15432
          command: |
            # Up to 180s. Clojure + datahike cold-start is ~15s on a
            # warm .m2, up to ~90s on a cold one; 180s leaves slack
            # for slow Clojars days without loitering forever on a
            # genuinely-broken startup.
            for i in $(seq 1 180); do
              nc -z localhost 15432 && exit 0
              sleep 1
            done
            echo "ERROR: pgwire did not come up on :15432 after 180s" >&2
            echo "--- last 100 lines of /tmp/pgwire.log ---" >&2
            tail -n 100 /tmp/pgwire.log >&2 || true
            exit 1

jobs:
  setup:
    executor: clj-jdk21
    steps:
      - restore_cache:
          keys:
            - source-{{ .Branch }}-{{ .Revision }}
            - source-{{ .Branch }}
            - source-
      - checkout
      - save_cache:
          key: source-{{ .Branch }}-{{ .Revision }}
          paths:
            - .git
      - install-clj-tools
      - restore_cache:
          keys:
            - deps-{{ checksum "deps.edn" }}
            - deps-
      - run:
          name: Resolve Clojure deps
          # Include :server so nrepl lands in .m2 — downstream
          # integration jobs run `clojure -M:server` in the background,
          # and a cold Clojars fetch for nrepl-1.0.0 pushes their
          # "Wait for server" poll past its deadline.
          command: clojure -A:dev:test:build:format:server -P
      - save_cache:
          key: deps-{{ checksum "deps.edn" }}
          paths:
            - /home/circleci/.m2
      - persist_to_workspace:
          root: /home/circleci/
          paths:
            - .m2
            - replikativ

  build:
    executor: clj-jdk21
    steps:
      - checkout
      - attach_workspace:
          at: /home/circleci
      - install-clj-tools
      - run:
          name: Compile Java sources
          command: bb prep
      - run:
          name: Build jar
          command: bb jar
      - run:
          name: Install jar to local Maven repository
          command: bb install
      - persist_to_workspace:
          root: /home/circleci/
          paths:
            - .m2
            - project/target

  format:
    executor: clj-jdk21
    steps:
      - checkout
      - attach_workspace:
          at: /home/circleci
      - install-clj-tools
      - run:
          name: Check formatting
          command: bb format
          no_output_timeout: 5m

  lint:
    executor: clj-jdk21
    steps:
      - checkout
      - attach_workspace:
          at: /home/circleci
      - install-clj-tools
      - run:
          name: clj-kondo lint
          command: bb lint
          no_output_timeout: 5m

  unittest:
    # Multi-image executor: openjdk-21 primary, postgres-16 sidecar.
    # The sidecar serves the byte-identical-roundtrip tests in
    # `pg-chinook-roundtrip-test`, which load Chinook into both
    # pg-datahike and a real PG and diff per-row. Without the sidecar
    # those tests skip-but-fail on Kaocha 1.91 ("test ran without
    # assertions"). Credentials match the test's defaults
    # (alice / foo); override via PGWIRE_REAL_PG_* if a future test
    # needs different ones.
    docker:
      - image: cimg/openjdk:21.0
      - image: cimg/postgres:16.0
        environment:
          POSTGRES_USER: alice
          POSTGRES_PASSWORD: foo
          POSTGRES_DB: postgres
    resource_class: medium
    steps:
      - checkout
      - attach_workspace:
          at: /home/circleci
      - install-clj-tools
      - run:
          name: Install netcat (for postgres wait)
          command: sudo apt-get update && sudo apt-get install -y --no-install-recommends netcat-openbsd
      - run:
          name: Wait for Postgres on :5432
          command: |
            for i in $(seq 1 60); do
              nc -z localhost 5432 && exit 0
              sleep 1
            done
            echo "ERROR: Postgres sidecar did not come up on :5432 after 60s" >&2
            exit 1
      - run:
          name: Compile Java sources
          command: bb prep
      - run:
          name: Run unit tests
          command: bb test
          no_output_timeout: 10m

  secondary-index-validation:
    executor: clj-jdk25
    steps:
      - checkout
      - attach_workspace:
          at: /home/circleci
      - install-clj-tools
      - run:
          name: Compile Java sources
          command: bb prep
      - run:
          name: Validate released secondary index stack
          command: >-
            clojure -J-Xmx2g -M:secondary-stack:test
            --focus datahike.test.pg-secondary-validation-test
          no_output_timeout: 15m

  campaign-inventory:
    executor: clj-jdk21
    steps:
      - checkout
      - install-clj-tools
      - run:
          name: Materialize pinned PostgreSQL regression source
          command: bb pg-regress-setup
          no_output_timeout: 10m
      - run:
          name: Validate beta-exit and PostgreSQL campaign inventories
          command: |
            bb beta-exit
            bb pg-regress-wave inventory

  sqllogictest:
    executor: clj-jdk21
    steps:
      - checkout
      - attach_workspace:
          at: /home/circleci
      - install-clj-tools
      - run:
          name: Compile Java sources
          command: bb prep
      - run:
          name: Run sqllogictest suite
          command: bb sqllogictest
          no_output_timeout: 10m

  pgjdbc-conformance:
    # pgjdbc tests require JDK 21. Use the standard CircleCI Java image
    # and install Clojure/bb on top — pgjdbc's gradle build hard-codes
    # its own JDK requirements so a matching image is cheapest.
    docker:
      - image: cimg/openjdk:21.0
    resource_class: large
    steps:
      - checkout
      - attach_workspace:
          at: /home/circleci
      - run:
          name: Install Clojure CLI
          command: |
            # download.clojure.org returns 403 from CI IPs — fetch the
            # canonical installer from GitHub Releases instead. --fail
            # aborts on any HTTP error so we don't silently write the
            # error body to disk and try to execute it.
            curl -sSLO --fail https://github.com/clojure/brew-install/releases/latest/download/linux-install.sh
            chmod +x linux-install.sh
            sudo ./linux-install.sh
      - run:
          name: Install babashka
          command: |
            curl -sL https://raw.githubusercontent.com/babashka/babashka/master/install | sudo bash
      - run:
          name: Compile Java sources
          command: bb prep
      - run:
          name: Clone pgjdbc
          command: bash test/integration/pgjdbc/setup.sh
      - start-pgwire-and-wait
      - run:
          name: Run ResultSetTest
          command: bash test/integration/pgjdbc/run-one.sh ResultSetTest
          no_output_timeout: 10m

  # --- Client-conformance integration jobs ----------------------------------
  # Each job provisions the client toolchain (Python venv, Node npm, Maven)
  # on top of the matching cimg/* base image, installs Clojure + babashka,
  # starts the pgwire server in the background, waits on :15432, then runs
  # the harness's own setup.sh + run.sh. See `doc/integration-testing.md`
  # for the cross-engine testing model.
  #
  # asyncpg + node-postgres run per-commit (not nightly): their run.sh
  # scripts gate green-unless-regression — node-postgres tiers files into
  # must-pass vs XFAIL; asyncpg diffs live failures against a checked-in
  # expected-failures.txt manifest. A failure outside the known-gap set
  # fails the job; everything else stays green. (The one hanging asyncpg
  # test — server-side cursor streaming — is deselected, see run.sh.)

  pgdump-roundtrip:
    # Round-trip pagila through PostgreSQL's OWN pg_dump and restore the
    # result into pg-datahike.
    #
    # The sidecar is the SOURCE database, and the dump is generated here
    # rather than vendored. That is the point: the repo already had a
    # real pg_dump of pagila, but taken with `--inserts`, so the DEFAULT
    # format (COPY) went untested and two decoding bugs survived it —
    # timestamptz in PG's output form and bytea hex. Generating the dump
    # tracks whatever pg_dump the image ships, so the next format drift
    # fails here instead of waiting for someone to regenerate a fixture.
    docker:
      - image: cimg/openjdk:21.0
      - image: cimg/postgres:16.0
        environment:
          POSTGRES_USER: pgtest
          POSTGRES_PASSWORD: pgtest
          POSTGRES_DB: postgres
    resource_class: medium
    steps:
      - checkout
      - attach_workspace:
          at: /home/circleci
      # cimg/openjdk ships neither the Clojure CLI nor babashka.
      - install-clj-tools
      - run:
          name: Install psql + pg_dump (matching the sidecar's major version)
          command: |
            # Ubuntu's default postgresql-client is older than the
            # postgres:16 sidecar, and pg_dump REFUSES to dump a server
            # newer than itself — it exits non-zero with an empty dump,
            # which reads as "0 COPY blocks" rather than as a version
            # error. Take the client from PGDG so the majors match.
            sudo apt-get update && sudo apt-get install -y --no-install-recommends \
              curl ca-certificates gnupg netcat-openbsd
            curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
              | sudo gpg --dearmor -o /usr/share/keyrings/pgdg.gpg
            echo "deb [signed-by=/usr/share/keyrings/pgdg.gpg] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
              | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends postgresql-client-16
            pg_dump --version
      - run:
          name: Wait for the source PostgreSQL
          command: |
            for i in $(seq 1 60); do
              nc -z 127.0.0.1 5432 && exit 0
              sleep 2
            done
            echo "source PostgreSQL never came up" >&2; exit 1
      - run:
          name: Compile Java sources
          command: bb prep
      - start-pgwire-and-wait
      - run:
          name: pg_dump round-trip
          command: bash test/integration/pgdump/run.sh
          environment:
            PGDUMP_SRC_HOST: 127.0.0.1
            PGDUMP_SRC_PORT: "5432"
            PGDUMP_SRC_USER: pgtest
            PGDUMP_SRC_PASSWORD: pgtest
            PGDUMP_SRC_DB: postgres
          no_output_timeout: 20m
      # The restore log is where a data-decoding failure is legible; the
      # console prints only counts.
      - store_artifacts:
          path: test/integration/pgdump/last-restore.log
          destination: pgdump-last-restore.log
      - store_artifacts:
          path: test/integration/pgdump/pagila-default-format.sql
          destination: pagila-default-format.sql

  asyncpg-conformance:
    docker:
      - image: cimg/python:3.11
    resource_class: large
    steps:
      - checkout
      - attach_workspace:
          at: /home/circleci
      - run:
          name: Install JDK 21 + Clojure + babashka + netcat
          command: |
            # cimg/python has no JDK; install one for `bb prep` and
            # `clojure -M:server`. Safe here because no prior JDK is
            # present (ca-certificates-java's post-inst doesn't hit
            # the `cacerts` dir-vs-file conflict that cimg/openjdk
            # images surface).
            sudo apt-get update && sudo apt-get install -y --no-install-recommends \
              openjdk-21-jdk-headless netcat-openbsd
            curl -sSLO --fail https://github.com/clojure/brew-install/releases/latest/download/linux-install.sh
            chmod +x linux-install.sh
            sudo ./linux-install.sh
            curl -sL https://raw.githubusercontent.com/babashka/babashka/master/install | sudo bash
      - run:
          name: Compile Java sources
          command: bb prep
      - start-pgwire-and-wait
      - run:
          name: asyncpg setup
          command: bash test/integration/asyncpg/setup.sh
          no_output_timeout: 15m
      - run:
          name: asyncpg run
          command: bash test/integration/asyncpg/run.sh
          no_output_timeout: 20m
      # run.sh redirects pytest's per-test output to a file and prints only
      # the summary, so without this the console shows WHICH tests the gate
      # flagged but not WHY — and a flagged test cannot be told apart from
      # one that never ran. store_artifacts runs implicitly on failure too,
      # which is the case that matters most here.
      - store_artifacts:
          path: test/integration/asyncpg/last-run.log
          destination: asyncpg-last-run.log

  node-postgres-conformance:
    docker:
      - image: cimg/node:20.11
    steps:
      - checkout
      - attach_workspace:
          at: /home/circleci
      - run:
          name: Install JDK 21 + Clojure + babashka + netcat
          command: |
            sudo apt-get update && sudo apt-get install -y --no-install-recommends \
              openjdk-21-jdk-headless netcat-openbsd
            curl -sSLO --fail https://github.com/clojure/brew-install/releases/latest/download/linux-install.sh
            chmod +x linux-install.sh
            sudo ./linux-install.sh
            curl -sL https://raw.githubusercontent.com/babashka/babashka/master/install | sudo bash
      - run:
          name: Compile Java sources
          command: bb prep
      - start-pgwire-and-wait
      - run:
          name: node-postgres setup
          command: bash test/integration/node-postgres/setup.sh
          no_output_timeout: 10m
      - run:
          name: node-postgres run
          command: bash test/integration/node-postgres/run.sh
          no_output_timeout: 15m

  hibernate-app-conformance:
    # JDK 21 required — the Hibernate test pom.xml declares
    # maven.compiler.{source,target}=21. An openjdk:17.0 image can't
    # compile it.
    docker:
      - image: cimg/openjdk:21.0
    resource_class: large
    steps:
      - checkout
      - attach_workspace:
          at: /home/circleci
      - run:
          name: Install Clojure + babashka + Maven + netcat
          command: |
            # NOTE: do NOT `apt-get install maven` on cimg/openjdk:21.
            # Ubuntu's maven package Depends: on openjdk-11-jre-headless,
            # which trips ca-certificates-java's post-install script
            # (it expects /etc/ssl/certs/java/cacerts to be a file; the
            # image has it as a directory). The install aborts with
            # "jks-keystore exited with code 1". Fetch Maven directly
            # from Apache instead — no JDK dep, no post-inst.
            sudo apt-get update && sudo apt-get install -y --no-install-recommends netcat-openbsd
            MAVEN_VERSION=3.9.9
            curl -sL https://archive.apache.org/dist/maven/maven-3/${MAVEN_VERSION}/binaries/apache-maven-${MAVEN_VERSION}-bin.tar.gz \
              | sudo tar -xz -C /opt
            sudo ln -sf /opt/apache-maven-${MAVEN_VERSION}/bin/mvn /usr/local/bin/mvn
            mvn -v
            # download.clojure.org returns 403 from CI IPs — fetch the
            # canonical installer from GitHub Releases instead. --fail
            # aborts on any HTTP error so we don't silently write the
            # error body to disk and try to execute it.
            curl -sSLO --fail https://github.com/clojure/brew-install/releases/latest/download/linux-install.sh
            chmod +x linux-install.sh
            sudo ./linux-install.sh
            curl -sL https://raw.githubusercontent.com/babashka/babashka/master/install | sudo bash
      - run:
          name: Compile Java sources
          command: bb prep
      - start-pgwire-and-wait
      - run:
          name: Hibernate integration test
          # Drop -q so CI logs show compile errors / maven download issues
          # on failure. Keeps the quiet-default habit local but doesn't
          # hide diagnostics in CI.
          command: cd test/integration/hibernate-app && mvn test -B --no-transfer-progress
          no_output_timeout: 15m

  sqlalchemy-conformance:
    docker:
      - image: cimg/python:3.11
    steps:
      - checkout
      - attach_workspace:
          at: /home/circleci
      - run:
          name: Install JDK 21 + Clojure + babashka + netcat
          command: |
            sudo apt-get update && sudo apt-get install -y --no-install-recommends \
              openjdk-21-jdk-headless netcat-openbsd
            curl -sSLO --fail https://github.com/clojure/brew-install/releases/latest/download/linux-install.sh
            chmod +x linux-install.sh
            sudo ./linux-install.sh
            curl -sL https://raw.githubusercontent.com/babashka/babashka/master/install | sudo bash
      - run:
          name: Install SQLAlchemy + psycopg2
          command: pip install --quiet sqlalchemy psycopg2-binary
      - run:
          name: Compile Java sources
          command: bb prep
      - start-pgwire-and-wait
      - run:
          name: SQLAlchemy 7-phase dialect smoke
          command: python3 test/integration/test_sqlalchemy.py
          no_output_timeout: 10m

  deploy:
    executor: clj-jdk21
    steps:
      - checkout
      - attach_workspace:
          at: /home/circleci
      - install-clj-tools
      - run:
          name: Deploy to Clojars
          command: bb clojars

  build-uber:
    executor: clj-jdk21
    steps:
      - checkout
      - attach_workspace:
          at: /home/circleci
      - install-clj-tools
      - run:
          name: Build standalone uberjar
          command: bb uber
      - persist_to_workspace:
          root: /home/circleci/
          paths:
            - project/target

  release:
    executor: clj-jdk21
    steps:
      - checkout
      - attach_workspace:
          at: /home/circleci
      - run:
          name: Install GitHub CLI
          command: |
            curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg \
              | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
            echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" \
              | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null
            sudo apt update
            sudo apt install gh -y
      - run:
          name: Create GitHub release
          command: |
            if [ "${CIRCLE_BRANCH}" = "main" ] && [ -n "${GITHUB_TOKEN}" ]; then
              JAR_FILE=$(ls target/pg-datahike-*.jar | grep -v standalone | head -1)
              UBER_FILE=$(ls target/pg-datahike-*-standalone.jar | head -1)
              STABLE_UBER_FILE=target/pg-datahike-standalone.jar
              cp "$UBER_FILE" "$STABLE_UBER_FILE"
              VERSION=$(basename "$JAR_FILE" | sed 's/pg-datahike-//' | sed 's/.jar//')
              echo "Publishing release for version ${VERSION}"
              cat > /tmp/release-notes.md \<<EOF
            pg-datahike ${VERSION} — library jar + standalone server uberjar.

            Download and run the latest release with:

                curl -fLO https://github.com/replikativ/pg-datahike/releases/latest/download/pg-datahike-standalone.jar
                java -jar pg-datahike-standalone.jar --port 5432 --memory

            See \`--help\` for the full CLI surface.
            EOF
              if gh release view "v${VERSION}" > /dev/null 2>&1; then
                gh release upload "v${VERSION}" \
                  "$JAR_FILE" "$UBER_FILE" "$STABLE_UBER_FILE" \
                  --clobber
              else
                gh release create "v${VERSION}" \
                  --title "Release ${VERSION}" \
                  --notes-file /tmp/release-notes.md \
                  "$JAR_FILE" "$UBER_FILE" "$STABLE_UBER_FILE"
              fi
            else
              echo "Skipping release - not on main branch or no GITHUB_TOKEN"
            fi

workflows:
  build-test-and-deploy:
    jobs:
      - setup:
          context: ghcr-read-package
      - build:
          context: ghcr-read-package
          requires:
            - setup
      - format:
          context: ghcr-read-package
          requires:
            - setup
      - lint:
          context: ghcr-read-package
          requires:
            - setup
      - unittest:
          context: ghcr-read-package
          requires:
            - build
      - secondary-index-validation:
          context: ghcr-read-package
          requires:
            - build
      - campaign-inventory:
          context: ghcr-read-package
          requires:
            - setup
      - sqllogictest:
          context: ghcr-read-package
          requires:
            - build
      - pgjdbc-conformance:
          context: ghcr-read-package
          requires:
            - build
      - hibernate-app-conformance:
          context: ghcr-read-package
          requires:
            - build
      - sqlalchemy-conformance:
          context: ghcr-read-package
          requires:
            - build
      - pgdump-roundtrip:
          context: ghcr-read-package
          requires:
            - build
      - asyncpg-conformance:
          context: ghcr-read-package
          requires:
            - build
      - node-postgres-conformance:
          context: ghcr-read-package
          requires:
            - build
      - deploy:
          context:
            - ghcr-read-package
            - clojars-deploy
          filters:
            branches:
              only: main
          requires:
            - format
            - lint
            - unittest
            - secondary-index-validation
            - campaign-inventory
            - sqllogictest
            - pgjdbc-conformance
            - hibernate-app-conformance
            - sqlalchemy-conformance
            - pgdump-roundtrip
            - asyncpg-conformance
            - node-postgres-conformance
      - build-uber:
          context: ghcr-read-package
          filters:
            branches:
              only: main
          requires:
            - build
      - release:
          context:
            - ghcr-read-package
            - github-token
          filters:
            branches:
              only: main
          requires:
            - deploy
            - build-uber
